# Runs the whole stack locally with one command: docker compose up
# - mongo:    the database
# - backend:  Spring Boot API on :8080
# - frontend: React app served by nginx on :3000

services:
  mongo:
    image: mongo:7
    container_name: shortly-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: shortly-backend
    ports:
      - "8080:8080"
    environment:
      # 'mongo' here is the service name above — Docker resolves it to the container
      MONGODB_URI: mongodb://mongo:27017/urlshortener
      APP_BASE_URL: http://localhost:8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: shortly-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
