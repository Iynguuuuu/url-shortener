# ---- Application ----
spring.application.name=url-shortener

# ---- MongoDB ----
# Falls back to a local MongoDB if the env var isn't set.
# In production (Render/Railway) you set MONGODB_URI to your Atlas connection string.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/urlshortener}

# ---- App settings ----
# Public base URL of THIS backend. Used to build the full short link.
# Override with APP_BASE_URL in production (e.g. https://your-api.onrender.com).
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Which frontend origins may call the API (comma-separated).
# Override with APP_CORS_ALLOWED_ORIGINS in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Server ----
server.port=${PORT:8080}
